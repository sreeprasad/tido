<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tido</title>
<style>
  :root { --fg:#1d1d1f; --muted:#6e6e73; --bg:#fafaf7; --card:#fff; --line:#e5e5e0; --accent:#4f46e5; --accent-bg:#eef2ff; --ok:#16a34a; --warn:#d97706; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f2f2f0; --muted:#a1a1a6; --bg:#141414; --card:#1e1e1e; --line:#2e2e2e; --accent:#818cf8; --accent-bg:#26244a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.6 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  main { max-width:560px; margin:0 auto; padding:40px 20px; }
  h1 { font-size:28px; margin:0 0 4px; } h2 { font-size:20px; margin:0 0 12px; } .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin:20px 0; }
  button, input, select { font:inherit; padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button { cursor:pointer; } button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row { display:flex; gap:8px; align-items:center; } .row input { flex:1; }
  .stack > * + * { margin-top:8px; }
  .code { font:600 40px/1 ui-monospace, monospace; letter-spacing:6px; }
  .link { display:flex; gap:8px; align-items:center; } .link input { flex:1; font-size:13px; }
  .err { color:#dc2626; font-size:14px; }
  .status { display:inline-flex; align-items:center; gap:6px; font-size:14px; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--warn); } .dot.live { background:var(--ok); }
  .badge { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .badge.open { color:var(--ok); border-color:var(--ok); }
  .opt { display:block; width:100%; text-align:left; padding:14px 16px; }
  .opt.chosen { border-color:var(--accent); background:var(--accent-bg); }
  .bar { margin:10px 0; } .bar-label { display:flex; justify-content:space-between; font-size:14px; }
  .track { height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
  .fill { height:100%; background:var(--accent); transition:width .4s ease; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const app = document.getElementById("app");
const el = (html) => { app.innerHTML = html; };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const CODE_RE = /^[23456789abcdefghjkmnpqrstuvwxyz]{6}$/;

function uid() {
  // Local test mode: ?test on localhost gives each tab its own identity.
  const test = location.hostname === "localhost" && new URLSearchParams(location.search).has("test");
  const store = test ? sessionStorage : localStorage;
  let id = store.getItem("tido:uid");
  if (!id) { id = crypto.randomUUID(); store.setItem("tido:uid", id); }
  return id;
}

/** Live connection: auto-reconnect (exponential backoff + jitter), free keepalives, presence. */
function live(code, { onMsg, onOpen } = {}) {
  let tries = 0, pingTimer = null, total = null, state = "connecting", ws = null;
  const render = () => {
    const s = $("status");
    if (!s) return;
    const here = total === null ? "" : ` · ${total} here`;
    s.innerHTML = `<span class="dot ${state === "live" ? "live" : ""}"></span>${state === "live" ? "live" : esc(state)}${here}`;
  };
  const open = () => {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws/${code}?uid=${uid()}`);
    ws.onopen = () => {
      tries = 0; state = "live"; render();
      pingTimer = setInterval(() => { if (ws.readyState === 1) ws.send("ping"); }, 30000);
      onOpen && onOpen();
    };
    ws.onmessage = (e) => {
      if (e.data === "pong") return;
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.type === "presence") { total = msg.total; render(); }
      if (msg.type === "snapshot") { total = msg.presence; render(); }
      onMsg && onMsg(msg);
    };
    ws.onclose = () => {
      clearInterval(pingTimer);
      state = "reconnecting"; render();
      const delay = Math.min(10000, 500 * 2 ** tries++) * (0.5 + Math.random());
      setTimeout(open, delay);
    };
  };
  render();
  open();
  return { send: (obj) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); } };
}

/** Shared poll state, updated from server messages. */
function pollStore(onChange) {
  const s = { poll: null, results: null, yourVote: null, error: "" };
  s.apply = (msg) => {
    if (msg.type === "snapshot") { s.poll = msg.poll; s.results = msg.results; s.yourVote = msg.yourVote; }
    else if (msg.type === "poll") {
      if (!s.poll || s.poll.id !== msg.poll.id || s.poll.round !== msg.poll.round) s.yourVote = null;
      s.poll = msg.poll;
    }
    else if (msg.type === "results") s.results = msg;
    else if (msg.type === "voted") { s.yourVote = msg.options; s.error = ""; }
    else if (msg.type === "error") s.error = msg.error;
    else return;
    onChange();
  };
  return s;
}

function resultsHtml(poll, results) {
  if (!results || results.pollId !== poll.id || results.round !== poll.round) return "";
  if (!results.counts) return `<p class="muted" style="font-size:14px">Results appear when the poll closes · ${results.voters} voted</p>`;
  const bars = poll.options.map((o, i) => {
    const c = results.counts[i] || 0;
    const pct = results.voters ? Math.round((100 * c) / results.voters) : 0;
    return `<div class="bar"><div class="bar-label"><span>${esc(o)}</span><span class="muted">${c} · ${pct}%</span></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`;
  }).join("");
  return bars + `<p class="muted" style="font-size:13px;margin:4px 0 0">${results.voters} voted</p>`;
}

function copyRow(label, value) {
  return `<div class="muted" style="font-size:13px;margin-top:12px">${esc(label)}</div>
    <div class="link"><input readonly value="${esc(value)}"><button onclick="navigator.clipboard.writeText(this.previousElementSibling.value);this.textContent='Copied'">Copy</button></div>`;
}

// ---------------- Landing ----------------

function landing() {
  el(`<h1>Tido</h1><p class="muted">Live polls and Q&amp;A. No sign-up.</p>
    <div class="card"><button class="primary" id="new">New room</button> <span id="newErr" class="err"></span></div>
    <div class="card"><div class="muted" style="margin-bottom:8px">Join a room</div>
      <form class="row" id="join"><input id="code" placeholder="6-character code" maxlength="6" autocomplete="off" style="text-transform:lowercase"><button class="primary">Join</button></form>
      <div id="joinErr" class="err"></div></div>`);
  $("new").onclick = async () => {
    const r = await fetch("/api/rooms", { method: "POST" });
    if (!r.ok) { $("newErr").textContent = "Could not create room"; return; }
    const { code, hostToken } = await r.json();
    localStorage.setItem("tido:host:" + code, hostToken);
    location.href = "/host/" + code;
  };
  $("join").onsubmit = (e) => {
    e.preventDefault();
    const code = $("code").value.trim().toLowerCase();
    if (!CODE_RE.test(code)) { $("joinErr").textContent = "Enter a valid 6-character code"; return; }
    location.href = "/r/" + code;
  };
}

// ---------------- Host ----------------

async function host(code) {
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("t")) { localStorage.setItem("tido:host:" + code, hash.get("t")); history.replaceState(null, "", location.pathname); }
  const token = localStorage.getItem("tido:host:" + code);
  if (!token) return el(`<h1>Not authorized</h1><p class="muted">Open the host link you saved when creating this room.</p>`);
  const ok = await fetch(`/api/rooms/${code}/host`, { method: "POST", headers: { authorization: "Bearer " + token } });
  if (!ok.ok) return el(`<h1>Not authorized</h1><p class="muted">This host link is invalid for room ${esc(code)}.</p>`);

  const base = location.origin;
  el(`<p class="muted">Host view · <span id="status" class="status"></span></p><div class="code">${esc(code)}</div>
    <div class="card">${copyRow("Audience link — share this", `${base}/r/${code}`)}
      ${copyRow("Host link — keep private (opens host view on another device)", `${base}/host/${code}#t=${token}`)}</div>
    <div class="card" id="composer" style="display:none">
      <h2>New poll</h2>
      <div class="stack">
        <input id="q" placeholder="Ask a question" maxlength="200" style="width:100%">
        <div id="opts" class="stack"></div>
        <button id="addOpt">+ Add option</button>
        <label class="row" style="font-size:14px"><input type="checkbox" id="multi" style="flex:none"> Allow multiple choices</label>
        <label class="row" style="font-size:14px">Results:
          <select id="show" style="flex:1"><option value="live">Visible live</option><option value="after">After poll closes</option></select></label>
      </div>
      <div class="actions"><button class="primary" id="create">Create poll</button><button id="cancel">Cancel</button></div>
      <div id="composeErr" class="err"></div>
    </div>
    <div class="card" id="pollCard"></div>`);

  const api = (path) => fetch(`/api/rooms/${code}${path}`, {
    method: "POST", headers: { authorization: "Bearer " + token, "content-type": "application/json" },
  });

  // --- composer ---
  const addOptRow = (value = "") => {
    if ($("opts").children.length >= 6) return;
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<input maxlength="80" placeholder="Option ${$("opts").children.length + 1}"><button aria-label="Remove">✕</button>`;
    row.querySelector("input").value = value;
    row.querySelector("button").onclick = () => { if ($("opts").children.length > 2) row.remove(); };
    $("opts").appendChild(row);
  };
  const showComposer = (on) => {
    $("composer").style.display = on ? "block" : "none";
    $("pollCard").style.display = on ? "none" : "block";
    if (on) { $("q").value = ""; $("opts").innerHTML = ""; addOptRow(); addOptRow(); $("composeErr").textContent = ""; $("q").focus(); }
  };
  $("addOpt").onclick = () => addOptRow();
  $("cancel").onclick = () => showComposer(false);
  $("create").onclick = async () => {
    const options = [...$("opts").querySelectorAll("input")].map((i) => i.value.trim()).filter(Boolean);
    const body = JSON.stringify({ question: $("q").value.trim(), options, multi: $("multi").checked, showResults: $("show").value });
    const r = await fetch(`/api/rooms/${code}/polls`, {
      method: "POST", headers: { authorization: "Bearer " + token, "content-type": "application/json" }, body,
    });
    if (!r.ok) { $("composeErr").textContent = (await r.json().catch(() => ({}))).error || "Could not create poll"; return; }
    showComposer(false);
  };

  // --- active poll ---
  const store = pollStore(() => render());
  const render = () => {
    const p = store.poll;
    if (!p) {
      $("pollCard").innerHTML = `<h2>No poll yet</h2><button class="primary" id="newPoll">Create a poll</button>`;
    } else {
      const label = { draft: "Draft · hidden from audience", open: "Open", closed: "Closed" }[p.state];
      $("pollCard").innerHTML = `
        <div class="row" style="justify-content:space-between"><span class="badge ${p.state === "open" ? "open" : ""}">${label}</span>
          <span class="muted" style="font-size:13px">${p.multi ? "Multiple choice" : "Single choice"} · results ${p.showResults === "live" ? "live" : "after close"}</span></div>
        <h2 style="margin-top:12px">${esc(p.question)}</h2>
        ${resultsHtml(p, store.results)}
        <div class="actions">
          ${p.state !== "open" ? `<button class="primary" data-act="open">${p.state === "closed" ? "Reopen" : "Open voting"}</button>` : ""}
          ${p.state === "open" ? `<button class="primary" data-act="close">Close voting</button>` : ""}
          <button data-act="reset">Reset votes</button>
          <button id="newPoll">New poll</button>
        </div>`;
      $("pollCard").querySelectorAll("[data-act]").forEach((b) => {
        b.onclick = async () => {
          if (b.dataset.act === "reset" && !confirm("Clear all votes for this poll?")) return;
          b.disabled = true;
          await api(`/polls/${p.id}/${b.dataset.act}`);
          b.disabled = false;
        };
      });
    }
    $("newPoll").onclick = () => showComposer(true);
  };

  const conn = live(code, { onMsg: store.apply, onOpen: () => conn.send({ type: "auth", token }) });
  render();
}

// ---------------- Audience ----------------

async function audience(code) {
  const r = await fetch(`/api/rooms/${code}`);
  if (r.status === 404) return el(`<h1>Room not found</h1><p class="muted">Check the code and try again. <a href="/">Back</a></p>`);
  if (!r.ok) return el(`<h1>Something went wrong</h1>`);

  el(`<p class="muted">Room <b>${esc(code)}</b> · <span id="status" class="status"></span></p><div class="card" id="pollCard"></div>`);

  let conn;
  const store = pollStore(() => render());
  const render = () => {
    const p = store.poll;
    if (!p || p.state === "draft") {
      $("pollCard").innerHTML = `<p class="muted" style="margin:0">Waiting for the host to start a poll…</p>`;
      return;
    }
    const chosen = new Set(store.yourVote || []);
    const canVote = p.state === "open";
    const optsHtml = p.options.map((o, i) => p.multi
      ? `<label class="opt btn-like card" style="margin:8px 0;padding:12px 16px;display:flex;gap:10px;align-items:center">
           <input type="checkbox" data-i="${i}" ${chosen.has(i) ? "checked" : ""} ${canVote ? "" : "disabled"}> ${esc(o)}</label>`
      : `<button class="opt ${chosen.has(i) ? "chosen" : ""}" data-i="${i}" style="margin:8px 0" ${canVote ? "" : "disabled"}>${esc(o)}</button>`
    ).join("");
    $("pollCard").innerHTML = `
      <div class="row" style="justify-content:space-between"><span class="badge ${canVote ? "open" : ""}">${canVote ? "Voting open" : "Voting closed"}</span>
        ${store.yourVote ? `<span class="muted" style="font-size:13px">✓ Vote recorded${canVote ? " · tap to change" : ""}</span>` : ""}</div>
      <h2 style="margin-top:12px">${esc(p.question)}</h2>
      ${optsHtml}
      ${p.multi && canVote ? `<button class="primary" id="submitMulti">Submit</button>` : ""}
      <div class="err">${esc(store.error)}</div>
      ${store.yourVote || !canVote ? resultsHtml(p, store.results) : ""}`;

    if (!canVote) return;
    if (p.multi) {
      $("submitMulti").onclick = () => {
        const options = [...$("pollCard").querySelectorAll("input[type=checkbox]:checked")].map((c) => Number(c.dataset.i));
        if (!options.length) { store.error = "Pick at least one option"; render(); return; }
        conn.send({ type: "vote", pollId: p.id, options });
      };
    } else {
      $("pollCard").querySelectorAll("button.opt").forEach((b) => {
        b.onclick = () => conn.send({ type: "vote", pollId: p.id, options: [Number(b.dataset.i)] });
      });
    }
  };

  conn = live(code, { onMsg: store.apply });
  render();
}

const [, kind, rawCode] = location.pathname.split("/");
const code = (rawCode || "").toLowerCase();
if (kind === "host" && CODE_RE.test(code)) host(code);
else if (kind === "r" && CODE_RE.test(code)) audience(code);
else landing();
</script>
</body>
</html>
